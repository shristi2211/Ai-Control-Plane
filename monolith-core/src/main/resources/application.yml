server:
  port: 8081

spring:
  application:
    name: monolith-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_control_plane}
    username: ${SPRING_DATASOURCE_USERNAME:ai_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  # Disable auto-DDL for now — we'll add Flyway/Liquibase later
  jpa:
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
